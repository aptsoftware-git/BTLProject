<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Proofreader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      window.addEventListener('error', function(e) {
        fetch('/api/log-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: window.location.href,
            message: e.message,
            source: e.filename,
            line: e.lineno,
            col: e.colno,
            stack: e.error ? e.error.stack : ''
          })
        }).catch(() => {});
      });
      window.addEventListener('unhandledrejection', function(e) {
        fetch('/api/log-error', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url: window.location.href,
            message: 'Unhandled Rejection: ' + (e.reason ? e.reason.message || String(e.reason) : ''),
            stack: e.reason && e.reason.stack ? e.reason.stack : ''
          })
        }).catch(() => {});
      });
    </script>
    <script type="module" crossorigin src="/assets/index-CGBpGg8g.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Oyla_fFe.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
